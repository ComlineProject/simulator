[package]
name = "comline-simulator"
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "The Comline playground / tutorial simulation engine — Rust → WASM."
repository = "https://github.com/ComlineProject/simulator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real runtime contract — framing (datagram@1, datagram@2, JSON-RPC),
# envelope, handshake, dispatch, wire format. Not `std`: it pulls
# `libloading` (dylib), which won't build for wasm32. `jsonrpc` brings the
# JSON-RPC framing without `std`. The simulator supplies its own codecs,
# tapped transport and pump on top of these.
comline-runtime = { git = "https://github.com/ComlineProject/runtime", rev = "207b38a670766f73afd155a87caa372caf9e8aa5", default-features = false, features = ["alloc", "jsonrpc"] }

serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: read every `f64` back exactly, not one ulp off (the
# default parser is faster but best-effort), as comline-runtime's JSON format
# does.
serde_json = { version = "1", features = ["float_roundtrip"] }
# MessagePack wire format (milestone 2g), alongside JSON.
rmp-serde = "1"
# base64url for the shareable session link (`#s=…`) and recordings
base64 = "0.22"
# Rhai for user-scripted server behaviours (milestone 2f). Optional — a build
# without it keeps `BehaviorKind::Script` but its factory returns a stub that
# reports "scripting is not enabled". `serde` for `Value` ⇄ `Dynamic`.
rhai = { version = "1", default-features = false, features = ["std", "serde", "no_module", "no_custom_syntax", "no_time"], optional = true }
wasm-bindgen = "0.2"

[features]
default = ["script"]
script = ["dep:rhai"]

[profile.release]
opt-level = "s"
lto = true
