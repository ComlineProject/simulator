[package]
name = "comline-simulator"
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "The Comline playground / tutorial simulation engine — Rust → WASM."
repository = "https://github.com/ComlineProject/simulator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real runtime contract — framing, envelope, handshake, dispatch, wire
# format. `alloc` only: `std` pulls `libloading` (dylib) which won't build for
# wasm32. The simulator supplies its own `WireFormat` (JSON), tapped transport
# and pump on top of these.
comline-runtime = { git = "https://github.com/ComlineProject/runtime", rev = "0dda42de5105e75e339bf66fa38085bd53ab9ab9", default-features = false, features = ["alloc"] }

serde = { version = "1", features = ["derive"] }
# `raw_value` lets the JSON-RPC framing splice an already-encoded params / body
# value into its envelope without a re-parse.
serde_json = { version = "1", features = ["raw_value"] }
# MessagePack wire format (milestone 2g), alongside JSON.
rmp-serde = "1"
# base64url for the shareable session link (`#s=…`) and recordings
base64 = "0.22"
# Rhai for user-scripted server behaviours (milestone 2f). Optional — a build
# without it keeps `BehaviorKind::Script` but its factory returns a stub that
# reports "scripting is not enabled". `serde` for `Value` ⇄ `Dynamic`.
rhai = { version = "1", default-features = false, features = ["std", "serde", "no_module", "no_custom_syntax", "no_time"], optional = true }
wasm-bindgen = "0.2"

[features]
default = ["script"]
script = ["dep:rhai"]

[profile.release]
opt-level = "s"
lto = true
